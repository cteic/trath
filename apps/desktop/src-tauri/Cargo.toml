[package]
name = "desktop"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
