name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: cteic/foundry/.github/workflows/checks.yml@5fb07ddb5374ecebad5e2aeece6a0f04ea423cfc # dev, 2026-11-26
    with:
      build-command: pnpm build
      rust: true
      rust-working-directory: apps/desktop/src-tauri
      # The crate embeds the built frontend. An empty folder is enough for clippy and the tests.
      rust-prepare-command: mkdir -p ../dist

  app:
    name: Build the app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm tauri build --debug
